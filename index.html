body {
  font-family: system-ui, sans-serif;
  background: #0f0f10;
  color: #e8e8e8;
  min-height: 100vh;
  display: grid;
  place-items: center;
}
.app {
  width: min(90vw, 360px);
  padding: 28px;
  border-radius: 24px;
  background: #1c1c1f;
  border: 1px solid #2a2a2e;
}
h1 { font-size: 22px; margin-bottom: 12px; }
p { opacity: .7; font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
button {
  background: #6c5cff;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 600;
  width: 100%;
}
.card {
  margin-top: 18px;
  padding: 12px 14px;
  background: #252529;
  border-radius: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}
.dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }`},{id:"script",name:"script.js",lang:"javascript",content:`const btn = document.getElementById('btn');
let count = 0;
btn?.addEventListener('click', () => {
  count++;
  btn.textContent = \`Tapped \${count}x - nice!\`;
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => btn.style.transform = 'scale(1)', 120);
});
console.log('Spck Mobile Clone running');`},{id:"readme",name:"README.md",lang:"markdown",content:`# Spck Mobile Clone

<script id="pwa-native-boot">
(function(){
  // ==== 1. Service Worker (footer) ====
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg){
          setInterval(function(){ reg.update && reg.update(); }, 30*60*1000);
        })
        .catch(function(e){ console.warn('[SW] register failed', e); });
    });
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(hadController && !window.__sw_reloaded){
        window.__sw_reloaded = true;
        setTimeout(function(){ location.reload(); }, 300);
      }
      hadController = true;
    });
    navigator.serviceWorker.addEventListener('message', function(e){
      if(e.data && e.data.type === 'HTML_UPDATED' && !window.__sw_reloaded){
        window.__sw_reloaded = true;
        setTimeout(function(){ location.reload(); }, 1200);
      }
    });
  }

  // ==== 2. Auto-update check (ETag) untuk tab yang sedang terbuka ====
  var lastETag = null;
  function checkForUpdate(){
    fetch('/?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function(res){
        var etag = res.headers.get('etag') || res.headers.get('last-modified') || '';
        if(!etag) return;
        if(lastETag === null){ lastETag = etag; return; }
        if(lastETag !== etag && !window.__sw_reloaded){
          lastETag = etag;
          window.__sw_reloaded = true;
          setTimeout(function(){ location.reload(); }, 300);
        }
      })
      .catch(function(){});
  }
  setInterval(checkForUpdate, 60000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkForUpdate();
  });
  setTimeout(checkForUpdate, 3000);

  // ==== 3. Status bar theme-color sync ====
  function applyThemeColor(){
    var root = document.querySelector('#root > div');
    var isLight = root && root.classList.contains('light');
    var color = isLight ? '#ffffff' : '#1e1e1e';
    var meta = document.querySelector('meta[name="theme-color"]');
    if(!meta){
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    if(meta.content !== color) meta.content = color;
  }
  var observedRoot = null;
  var mo = new MutationObserver(applyThemeColor);
  function attachThemeObserver(){
    var root = document.querySelector('#root > div');
    if(root){
      if(root !== observedRoot){
        observedRoot = root;
        mo.observe(root, { attributes: true, attributeFilter: ['class'] });
      }
      applyThemeColor();
    } else {
      setTimeout(attachThemeObserver, 200);
    }
  }
  attachThemeObserver();
  window.addEventListener('pageshow', applyThemeColor);
  window.addEventListener('focus', applyThemeColor);
})();
