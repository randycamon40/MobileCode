<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e" id="themeColorMeta">
<meta name="color-scheme" content="dark light">
<title>Mobile Code - SPCK clone</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mobile Code">
<meta name="application-name" content="Mobile Code">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/darcula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<style>
:root{--bg:#1e1e1e;--panel:#252526;--panel2:#2d2d30;--text:#d4d4d4;--muted:#8a8a8a;--accent:#4f9cf7;--border:#3a3a3d;--shadow:0 6px 20px rgba(0,0,0,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
:root[data-theme="light"]{--bg:#f5f5f5;--panel:#ffffff;--panel2:#ebebed;--text:#222;--muted:#6b6b6b;--accent:#1769d6;--border:#d6d6da;--shadow:0 6px 20px rgba(0,0,0,.15);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--text);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;display:flex;flex-direction:column;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Izinkan seleksi hanya di editor & input */
.CodeMirror,.CodeMirror *,.CodeMirror-line,input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:5}
.ib{width:38px;height:38px;border-radius:16px;display:grid;place-items:center;transition:background .2s,transform .15s;flex:none}
.ib:active{transform:scale(.9);background:var(--panel2)}
.ib:hover{background:var(--panel2)}
.ib.run{color:#3ddc84}
.logo{font-weight:600;color:var(--accent);margin-right:2px;flex:none}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:16px;background:var(--bg);color:var(--muted);white-space:nowrap;flex:none;transition:all .2s;font-size:12px}
.tab.active{background:var(--accent);color:#fff}
.tab .x{opacity:.7;font-size:15px;line-height:1;padding:0 3px}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#f0b429}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#editorWrap{flex:1;min-height:0;position:relative}
.CodeMirror{height:100%;font-family:'JetBrains Mono',monospace;font-size:14px}
:root[data-theme="light"] .CodeMirror{background:#fff;color:#222}
:root[data-theme="light"] .CodeMirror-gutters{background:#f0f0f2;border-right:1px solid var(--border)}
#keys{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--panel);border-top:1px solid var(--border);scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
#keys::-webkit-scrollbar{display:none}
#keys button{min-width:42px;height:38px;border-radius:16px;background:var(--panel2);font-weight:600;flex:none;padding:0 10px;transition:transform .12s,background .2s}
#keys button:active{transform:scale(.9);background:var(--accent);color:#fff}
#preview{display:none;flex-direction:column;height:50%;border-top:2px solid var(--accent);background:var(--panel)}
#preview.show{display:flex;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;gap:6px;padding:4px 10px;color:var(--muted)}
.phead b{flex:1;font-weight:600}
#frame{flex:1;border:0;background:#fff;width:100%;border-radius:16px 16px 0 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);z-index:21;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-radius:0 24px 24px 0;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.show{transform:none}
.dtabs{display:flex;gap:4px;padding:10px}
.dtabs button{flex:1;padding:9px 4px;border-radius:16px;color:var(--muted);transition:all .2s;font-size:12px}
.dtabs button.on{background:var(--accent);color:#fff}
.pane{display:none;flex:1;overflow-y:auto;padding:0 10px 10px}
.pane.on{display:block}
.row{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;transition:background .2s}
.row.active{background:var(--panel2);color:var(--accent)}
.row .nm{flex:1;padding:8px 0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ib{width:32px;height:32px}.row svg{width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:16px;background:var(--accent);color:#fff;font-weight:600;margin:6px 0 10px;transition:transform .15s}
.btn:active{transform:scale(.97)}
input.in,textarea.in{width:100%;padding:11px 14px;border-radius:16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;outline:none}
textarea.in{resize:vertical;line-height:1.5}
input.in:focus,textarea.in:focus{border-color:var(--accent)}
mark{background:#f0b429;color:#000;border-radius:4px;padding:0 1px}
.hint{color:var(--muted);font-size:12px;padding:6px 4px}
.mod{color:#f0b429;font-weight:600;width:16px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:10px 18px;border-radius:24px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#menu{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:8px;background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:6px;z-index:30;display:none;min-width:190px}
#menu.show{display:block;animation:up .2s ease}
#menu button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:14px}
#menu button:hover{background:var(--panel2)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#dlg.show{display:flex}
.card{background:var(--panel);border-radius:24px;padding:18px;width:min(340px,100%);box-shadow:var(--shadow);animation:up .2s ease}
.card h3{margin:0 0 12px;font-size:15px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:10px;border-radius:16px;background:var(--panel2)}
.acts .ok{background:var(--accent);color:#fff;font-weight:600}
.diff{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;max-height:60vh;overflow:auto;background:var(--bg);border-radius:12px;padding:10px;margin-top:8px;white-space:pre-wrap;word-break:break-word;text-align:left;user-select:text;-webkit-user-select:text}
.diff .add{background:rgba(61,220,132,.22);color:#3ddc84;display:block}
.diff .del{background:rgba(248,113,113,.22);color:#f87171;display:block;text-decoration:line-through;opacity:.85}
.gitsec{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 4px 4px;display:flex;justify-content:space-between;align-items:center}
.gitrow{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 10px;border-radius:12px}
.gitrow .gname{flex:1;padding:6px 0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;background:none;border:0;color:var(--text)}
.gitrow .gbtn{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none;background:none;border:0;color:var(--text)}
.gitrow .gbtn:active{background:var(--panel2)}
.gitrow .gbtn svg{width:14px;height:14px}

.import-box{padding:10px;background:var(--panel2);border-radius:16px;margin:8px 0;border:1px solid var(--border)}
.import-box .row-input{display:flex;gap:6px;margin-top:6px}
.import-box .in{font-size:12px}
#importStatus{margin-top:6px;word-break:break-all}
.import-box .check{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:6px}
.hash{font-size:11px;color:var(--muted);font-family:monospace;min-width:52px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:400px;padding:16px;box-shadow:var(--shadow)}
.modal-box h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between}
.modal-box h3 span{cursor:pointer;color:var(--muted)}
.console{background:var(--bg);border-top:2px solid var(--accent);height:150px;display:flex;flex-direction:column;font-family:monospace;font-size:11px;position:absolute;bottom:0;left:0;right:0;z-index:10;transform:translateY(100%);transition:transform .3s}
.console.show{transform:translateY(0)}
.console-head{display:flex;justify-content:space-between;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted)}
.console-log{flex:1;overflow:auto;padding:6px;line-height:1.4}
.console-line{border-bottom:1px solid var(--border);padding:2px 0;word-break:break-all}
.console-line.error{color:#f87171}
.console-line.warn{color:#f0b429}
.ctx-menu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:120;display:none;min-width:160px}
.ctx-menu.show{display:block}
.ctx-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:12px;color:var(--text)}
.ctx-menu button:hover{background:var(--panel2)}
#cmdPalette{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:110;padding-top:60px}
#cmdPalette.show{display:flex}
.cmd-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:400px;overflow:hidden;box-shadow:var(--shadow)}
.cmd-in{width:100%;padding:14px;background:var(--bg);border:0;border-bottom:1px solid var(--border);color:var(--text);outline:none}
.cmd-list{max-height:300px;overflow-y:auto}
.cmd-item{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.cmd-item:hover{background:var(--panel2)}
.tab .dot-unsaved{width:6px;height:6px;border-radius:50%;background:#3ddc84}
.batch-actions{display:grid;grid-template-columns:1fr 1fr 1.2fr 44px;gap:6px;margin-top:8px}
.batch-actions .btn{width:100%;min-width:0;padding:8px 4px;font-size:12px;margin:0;min-height:36px;gap:4px;overflow:hidden}
.batch-actions .btn.icon{padding:0;font-size:15px}
.batch-prompt-bar{display:flex;margin:6px 0 0}
.batch-prompt-bar .btn{width:100%;padding:10px;font-size:12px;margin:0;min-height:36px;background:var(--accent);color:#fff;border-color:var(--accent)}
.batch-status{margin-top:8px;padding:9px 12px;border-radius:12px;text-align:center;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--border);color:var(--muted);min-height:18px;line-height:1.4}
.batch-status.ok{color:#3ddc84;border-color:rgba(61,220,132,.45)}
.batch-status.err{color:#f87171;border-color:rgba(248,113,113,.45)}
.batch-status.warn{color:#f0b429;border-color:rgba(240,180,41,.45)}
.batch-detail{display:none;margin-top:8px;max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px}
.batch-detail.show{display:block}
.batch-item{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.4;margin-bottom:2px;background:var(--panel2)}
.batch-item .ic{flex-shrink:0;font-size:12px;width:14px;text-align:center;font-weight:700}
.batch-item .n{flex-shrink:0;font-weight:700;color:var(--muted);min-width:22px}
.batch-item .sn{flex:1;min-width:0;word-break:break-all}
.batch-item.ok .ic,.batch-item.ok .sn{color:#3ddc84}
.batch-item.miss .ic,.batch-item.miss .sn{color:#f87171}
.batch-item.bad .ic,.batch-item.bad .sn{color:#f0b429}
#btnFont, #btnFind, #btnTheme, #btnPalette { display: none !important; }
</style>
</head>
<body>
<header>
  <button class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <span class="logo">Spck</span>
  <div id="tabs"></div>
  <button class="ib" id="btnFont" aria-label="Font">A</button>
  <button class="ib" id="btnFind" aria-label="Find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
  <button class="ib run" id="btnRun" aria-label="Run"><svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button class="ib" id="btnSave" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H5zM8 3v5h7M8 21v-7h8v7"/></svg></button>
  <button class="ib" id="btnTheme" aria-label="Tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
        <button class="ib" id="btnPalette" aria-label="Menu Perintah"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="ib" id="btnMore" aria-label="Lainnya"><svg viewBox="0 0 24 24" style="fill:currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
</header>

<main>
  <div id="editorWrap"><textarea id="code"></textarea></div>
  <div class="console" id="previewConsole"><div class="console-head"><span>Console</span><span style="cursor:pointer" onclick="document.getElementById('previewConsole').classList.remove('show')">✕</span></div><div class="console-log" id="consoleLog"></div></div>
  <div id="preview">
    <div class="phead"><b>Preview</b>
      <button class="ib" id="pRefresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="ib" id="pClose" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
  </div>
  <div id="keys"></div>
</main>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dtabs">
    <button data-p="explorer" class="on">Explorer</button>
    <button data-p="git">Git</button>
    <button data-p="search">Search</button>
    <button data-p="batch">Batch</button>
  </div>
  <section class="pane on" id="p-explorer">
    <button class="btn" id="newFile">+ File baru</button>
    <div id="fileList"></div>
  </section>
  <section class="pane" id="p-git">

    <div class="import-box">
      <div class="gitsec" style="padding:0 0 6px 0">Import Repository</div>
      <input class="in" id="importUrl" placeholder="https://github.com/user/repo atau user/repo">
      <div class="row-input">
        <input class="in" id="importBranch" placeholder="branch: main" style="flex:1">
        <button class="btn" id="importBtn" style="width:auto;margin:0;padding:10px 16px;flex:none">Clone</button>
      </div>
      <label class="check"><input type="checkbox" id="importReplace"> Replace semua file lama</label>
      <div id="importStatus" class="hint">Tempel link repo GitHub lalu Clone. Support icon-192/512, sw.js, manifest.json, style.css + app.js terpisah tetap kebawa.</div>
    </div>

    <div class="hint">Branch: main · origin</div>
    <div class="gitsec">Staged</div>
    <div id="gitStaged"></div>
    <div class="gitsec"><span>Changes</span><button id="stageAll" style="font-size:10px;color:var(--accent);padding:2px 6px;border-radius:8px">Stage semua</button></div>
    <div id="gitList"></div>
    <input class="in" id="commitMsg" placeholder="Pesan commit…" style="margin-top:8px">
    <div class="gitsec">History</div>
    <div id="gitHistory"></div>
    <button class="btn" id="commitBtn">Commit &amp; Push</button>
  </section>
  <section class="pane" id="p-search">
    <input class="in" id="searchIn" placeholder="Cari nama file…" style="margin-top:4px">
    <div id="searchList" style="margin-top:8px"></div>
  </section>
  <section class="pane" id="p-batch">
    <div class="hint">Paste format CARI:/GANTI DENGAN: — pisah blok dengan ---</div>
    <div class="batch-prompt-bar">
      <button class="btn" id="batchPromptBtn" type="button" title="Tap: Copy prompt · Hold: Edit prompt">AI Prompt</button>
    </div>
    <textarea class="in" id="batchInput" placeholder="CARI:&#10;teks asli&#10;&#10;GANTI DENGAN:&#10;teks baru&#10;&#10;---&#10;&#10;CARI:&#10;...&#10;&#10;GANTI DENGAN:&#10;..." style="min-height:200px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:12px"></textarea>
    <div class="batch-actions">
      <button class="btn" id="batchPasteBtn" type="button">📋 Paste</button>
      <button class="btn" id="batchCheckBtn" type="button">🔍 Cek</button>
      <button class="btn" id="batchApplyBtn" type="button">⚡ Terapkan</button>
      <!-- ai-prompt dipindah ke atas textarea -->
      <button class="btn icon" id="batchClearBtn" type="button" title="Hapus">🗑</button>
    </div>
    <div class="batch-status" id="batchStatus">—</div>
    <div class="batch-detail" id="batchDetail"></div>
  </section>
</aside>

<div id="menu">
  <button id="mFind">🔍 Find / Replace</button>
  <button id="mPalette">⌨️ Command Palette</button>
  <button id="mFont">🔤 Perbesar Font</button>
  <button id="mTheme">🌗 Ganti Tema</button>
  
  <button id="mJump">🔢 Lompat ke baris...</button>
  <button id="mTemplate">📄 Template Cepat</button>
  <button id="mDl">⬇️ Download file aktif</button>
  <button id="mCloseTab">✕ Tutup tab aktif</button>
  <button id="mReset">🗑 Reset ke default</button>
</div>
<div id="tplModal" class="modal"><div class="modal-box"><h3>Template <span onclick="document.getElementById('tplModal').classList.remove('show')">✕</span></h3><button class="btn" onclick="applyTemplate('html5')">HTML5 Dasar</button><button class="btn" onclick="applyTemplate('form')">Form Kontak</button><button class="btn" onclick="applyTemplate('card')">Kartu Profil</button></div></div>
<div id="cmdPalette"><div class="cmd-box"><input class="cmd-in" id="cmdInput" placeholder="Ketik perintah..."><div class="cmd-list" id="cmdList"></div></div></div>
<div id="ctxMenu" class="ctx-menu">
  <button data-ctx="close">Tutup</button>
  <button data-ctx="others">Tutup Lainnya</button>
  <button data-ctx="all">Tutup Semua</button>
</div>

/* ===== Batch Replace (pane Batch) ===== */
function parseBatchPairs(raw){
 var lines=raw.replace(/\r\n?/g,'\n').split('\n');
 var pairs=[],cur=null,mode=null,buf=[];
 function flush(){
  if(!cur)return;
  var t=buf.join('\n').replace(/^\n+|\n+$/g,'');
  if(mode==='find')cur.find=t;
  else if(mode==='replace')cur.replace=t;
  buf=[];
 }
 function push(){
  flush();
  if(cur&&(typeof cur.find==='string'||typeof cur.replace==='string'))pairs.push(cur);
  cur=null;mode=null;buf=[];
 }
 for(var i=0;i<lines.length;i++){
  var line=lines[i];
  line=line.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,"'");
  var trim=line.trim()
   .replace(/^[-*•>\s]+/,'')
   .replace(/^[`*_]+/,'')
   .replace(/[`*_\s]+$/,'');
  if(/^-{3,}\s*$/.test(trim)){push();continue}
  if(/^CARI\s*:\s*$/i.test(trim)){push();cur={};mode='find';continue}
  if(/^GANTI\s+DENGAN\s*:\s*$/i.test(trim)||/^GANTI\s*:\s*$/i.test(trim)){flush();mode='replace';continue}
  if(/^#{1,6}\s/.test(trim)){push();continue}
  if(/^(Fungsi|Lokasi|Catatan|Note|Notes)\s*:/i.test(trim)){push();continue}
  if(mode)buf.push(line);
 }
 push();
 return pairs;
}
function batchSetStatus(txt,type){
 var el=$('batchStatus');if(!el)return;
 el.textContent=txt;
 el.className='batch-status'+(type?' '+type:'');
}
function batchRenderDetail(items){
 var el=$('batchDetail');if(!el)return;
 if(!items||!items.length){el.innerHTML='';el.classList.remove('show');return}
 var ic={ok:'✓',miss:'✕',bad:'!'};
 var h='';
 items.forEach(function(it){
  h+='<div class="batch-item '+it.status+'"><span class="ic">'+(ic[it.status]||'·')+'</span><span class="n">#'+it.n+'</span><span class="sn">'+esc(it.snippet)+'</span></div>';
 });
 el.innerHTML=h;el.classList.add('show');
}
function batchPreview(){
 var raw=$('batchInput').value;
 if(!raw.trim()){batchSetStatus('Kosong — paste dulu formatnya','');batchRenderDetail(null);return}
 var pairs=parseBatchPairs(raw);
 if(!pairs.length){batchSetStatus('❌ Tidak ada blok CARI/GANTI','err');batchRenderDetail(null);return}
 var sim=(S.active&&S.files.hasOwnProperty(S.active))?cm.getValue():'';
 var complete=0,found=0,miss=0,bad=0,items=[];
 pairs.forEach(function(p,i){
  var hasF=(typeof p.find==='string'&&p.find.length>0);
  var hasR=(typeof p.replace==='string');
  var st,sn;
  if(hasF&&hasR){
   complete++;
   var idx=sim.indexOf(p.find);
   if(idx!==-1){found++;st='ok';sim=sim.slice(0,idx)+p.replace+sim.slice(idx+p.find.length)}
   else{miss++;st='miss'}
   sn=p.find;
  }else{bad++;st='bad';sn=hasF?p.find:(hasR?'(CARI kosong)':'(kosong)')}
  if(sn.length>60)sn=sn.slice(0,57)+'...';
  items.push({n:i+1,status:st,snippet:sn.replace(/\n/g,'⏎')});
 });
 var msg='📋 '+pairs.length+' blok · '+complete+' lengkap · '+found+' cocok';
 if(miss)msg+=' · '+miss+' tidak ketemu';
 if(bad)msg+=' · '+bad+' tidak lengkap';
 batchSetStatus(msg,(complete>0&&found>0)?'ok':'err');
 batchRenderDetail(items);
}

};

/* ===== GitHub Import / Clone Repository ===== */
function parseGithubUrl(input){
  input=(input||'').trim();
  if(!input) return null;
  var owner=null,repo=null,branch=null;
  try{
    if(input.indexOf('github.com')>=0){
      var u=new URL(input);
      var parts=u.pathname.split('/').filter(Boolean);
      owner=parts[0]||null;
      repo=parts[1]?parts[1].replace(/\.git$/,''):null;
      if(parts[2]==='tree' && parts[3]) branch=parts.slice(3).join('/');
      else if(u.searchParams.get('branch')) branch=u.searchParams.get('branch');
    }else{
      // format user/repo or user/repo@branch or user/repo:branch
      var tmp=input;
      if(tmp.indexOf('@')>=0){
        var sp=tmp.split('@');
        tmp=sp[0];
        branch=sp[1];
      }else if(tmp.indexOf(':')>=0 && tmp.split(':').length===2){
        var sp2=tmp.split(':');
        // avoid port confusion, only if second part looks like branch
        if(sp2[1] && sp2[1].indexOf('/')<0){ tmp=sp2[0]; branch=sp2[1]; }
      }
      var p=tmp.split('/').filter(Boolean);
      owner=p[0]||null;
      repo=p[1]?p[1].replace(/\.git$/,''):null;
    }
  }catch(e){}
  if(!owner || !repo) return null;
  return {owner:owner,repo:repo,branch:branch||null};
}

async function importFromGithub(){
  var urlVal=$('importUrl').value.trim();
  var branchVal=$('importBranch').value.trim()||'main';
  var replace=$('importReplace').checked;
  var info=parseGithubUrl(urlVal);
  if(!info){
    toast('Format salah. Contoh: https://github.com/user/repo');
    $('importStatus').textContent='Format salah. Pakai user/repo atau link GitHub';
    return;
  }
  var owner=info.owner;
  var repo=info.repo;
  var branch=info.branch||branchVal||'main';

  var btn=$('importBtn');
  btn.textContent='...';
  btn.disabled=true;
  $('importStatus').textContent='Mengunduh '+owner+'/'+repo+'@'+branch+' ...';

  var branchesToTry=[branch];
  if(branch!=='main') branchesToTry.push('main');
  if(branch!=='master') branchesToTry.push('master');
  // dedup
  branchesToTry=branchesToTry.filter(function(v,i,a){return a.indexOf(v)===i});

  function urlTemplates(br){
    return [
      'https://codeload.github.com/'+owner+'/'+repo+'/zip/'+br,
      'https://github.com/'+owner+'/'+repo+'/archive/refs/heads/'+br+'.zip',
      'https://api.github.com/repos/'+owner+'/'+repo+'/zipball/'+br
    ];
  }

  var blob=null;
  var successBranch=null;
  outer: for(var i=0;i<branchesToTry.length;i++){
    var br=branchesToTry[i];
    var list=urlTemplates(br);
    for(var j=0;j<list.length;j++){
      var u=list[j];
      try{
        $('importStatus').textContent='Mencoba '+br+' → '+(u.indexOf('codeload')>=0?'codeload':u.indexOf('refs/heads')>=0?'github-archive':'api');
        var r=await fetch(u,{redirect:'follow'});
        if(!r.ok) continue;
        var b=await r.blob();
        if(b.size<200) continue;
        // quick check if html error page
        if(b.type.indexOf('text/html')>=0 && b.size<5000){
          var t=await b.text();
          if(t.indexOf('<!DOCTYPE')>=0 || t.toLowerCase().indexOf('not found')>=0) continue;
        }
        blob=b;
        successBranch=br;
        break outer;
      }catch(e){
        // try cors proxy fallback
        try{
          var proxy='https://corsproxy.io/?'+encodeURIComponent(u);
          var r2=await fetch(proxy);
          if(!r2.ok) continue;
          var b2=await r2.blob();
          if(b2.size>200){ blob=b2; successBranch=br; break outer; }
        }catch(e2){}
      }
    }
  }

  if(!blob){
    $('importStatus').textContent='Gagal download. Pastikan repo public & branch benar (coba main/master).';
    btn.textContent='Clone';
    btn.disabled=false;
    toast('Gagal clone. Cek koneksi / repo private?');
    return;
  }

  try{
    var ab=await blob.arrayBuffer();
    fflate.unzip(new Uint8Array(ab), function(err, unzipped){
      if(err){
        $('importStatus').textContent='Gagal unzip: '+err;
        btn.textContent='Clone';
        btn.disabled=false;
        return;
      }
      var files={};
      var keys=Object.keys(unzipped);
      var rootPrefix='';
      if(keys.length){
        // detect top folder like repo-branch/
        var first=keys[0];
        var slash=first.indexOf('/');
        if(slash>0) rootPrefix=first.slice(0,slash+1);
      }
      var count=0, skipped=0;
      for(var k in unzipped){
        var rel=k;
        if(rootPrefix && k.indexOf(rootPrefix)===0) rel=k.slice(rootPrefix.length);
        if(!rel) continue;
        if(rel.charAt(rel.length-1)==='/') continue; // folder
        // skip .git, node_modules big?
        if(rel.indexOf('__MACOSX')===0) continue;
        if(rel.split('/').some(function(p){return p==='.git';})) continue;
        var data=unzipped[k];
        if(data.length>2*1024*1024){ skipped++; continue; } // >2MB skip
        var ext=rel.split('.').pop().toLowerCase();
        var imageExts=['png','jpg','jpeg','webp','gif','ico','bmp'];
        // for images (icon-192, icon-512) keep as base64 data url so tetap kebawa di repo
        if(imageExts.indexOf(ext)>=0){
          try{
            // binary to base64
            var bin='';
            for(var bi=0;bi<data.length;bi++) bin+=String.fromCharCode(data[bi]);
            var b64=btoa(bin);
            var mime= ext==='png'?'image/png': ext==='jpg'||ext==='jpeg'?'image/jpeg': ext==='webp'?'image/webp': ext==='gif'?'image/gif':'image/'+ext;
            // Simpan sebagai data url string, tapi editor akan tampilkan panjang, tetap kita simpan
            // Untuk file icon, kita simpan base64 murni juga bisa, tapi data url lebih aman
            // Di SPCK clone ini, kita simpan base64 data url
            files[rel]='data:'+mime+';base64,'+b64;
            // Juga simpan versi kosong placeholder untuk editor agar tidak berat? Tidak, simpan data url
            count++;
          }catch(e){ skipped++; }
        }else{
          try{
            var txt=new TextDecoder().decode(data);
            // filter binary with null char for non-text exts
            if(txt.indexOf('\0')>=0){
              var textExts=['html','htm','css','js','json','md','txt','toml','yaml','yml','xml','svg','ts','jsx','tsx','vue','cjs','mjs','less','scss'];
              if(textExts.indexOf(ext)<0){ skipped++; continue; }
            }
            files[rel]=txt;
            count++;
          }catch(e){ skipped++; }
        }
      }

      if(count===0){
        $('importStatus').textContent='ZIP kosong atau hanya file binary. '+skipped+' dilewati.';
        btn.textContent='Clone';
        btn.disabled=false;
        return;
      }

      if(replace){
        S.files={};
        S.open=[];
        S.staged={};
      }
      // merge files - keep folder structure as file name (contoh: css/style.css tetap)
      Object.keys(files).forEach(function(fn){
        // Kalau file sudah ada dan isinya sama, skip
        S.files[fn]=files[fn];
        S.savedFiles[fn]=files[fn];
      });

      // Cari entry html
      var htmlFiles=Object.keys(files).filter(function(f){return /\.html?$/i.test(f);});
      var entry=null;
      if(htmlFiles.indexOf('index.html')>=0) entry='index.html';
      else if(htmlFiles.length) entry=htmlFiles[0];
      else entry=Object.keys(files)[0];

      S.active=entry;
      if(S.open.indexOf(entry)<0) S.open.push(entry);

      persist();
      renderAll();
      openInEditor();

      var msg='Berhasil! '+count+' file dari '+owner+'/'+repo+'@'+successBranch;
      if(skipped) msg+=' ('+skipped+' binary besar dilewati)';
      msg+='. style.css & app.js terpisah tetap kebawa.';
      $('importStatus').textContent=msg;
      btn.textContent='Clone';
      btn.disabled=false;
      toast('Import '+count+' file berhasil');

      // Auto-run preview if html
      if(/\.html?$/i.test(entry)){
        setTimeout(function(){ try{ runPreview(); }catch(e){} }, 500);
      }
    });
  }catch(e){
    $('importStatus').textContent='Error: '+e.message;
    btn.textContent='Clone';
    btn.disabled=false;
  }
}

/* preview — perbaiki doctype agar tidak quirks mode */
function buildDoc(){
 if(S.active)S.files[S.active]=cm.getValue();
 var entry=(S.active&&/\.html?$/i.test(S.active))?S.active
  :(S.files['index.html']!==undefined?'index.html'
  :Object.keys(S.files).filter(function(n){return /\.html?$/i.test(n)})[0]||'');

var lastTouch=0;

var lastT=0;

if('serviceWorker' in navigator){

      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('Versi baru tersedia. Tutup & buka lagi untuk update.');
          }
        });
      });
    }).catch(function(){/* diabaikan */});
  });
  navigator.serviceWorker.addEventListener('message',function(e){
    if(e.data&&e.data.type==='HTML_UPDATED'){
      toast('Kode terbaru tersedia. Tutup & buka lagi untuk update.');
    }
  });
}

/* ===== File Handlers (Launch Queue API) dari manifest.json ===== */
if('launchQueue' in window){
  launchQueue.setConsumer(async function(params){
    if(!params||!params.files||!params.files.length)return;
    for(var i=0;i<params.files.length;i++){
      try{
        var handle=params.files[i];
        var file=await handle.getFile();
        var text=await file.text();
        var name=file.name||'file.txt';
        var dot=name.lastIndexOf('.');
        var base=dot>0?name.slice(0,dot):name;
        var ext=dot>0?name.slice(dot):'';
        var candidate=name,n=1;
        while(S.files[candidate]!==undefined){candidate=base+' ('+n+')'+ext;n++;}
        S.files[candidate]=text;
        switchTo(candidate);
        toast('Dibuka: '+candidate);
      }catch(err){}
    }
    persist();
  });
}

openInEditor();renderAll();
})();
