<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e" id="themeColorMeta">
<meta name="color-scheme" content="dark light">
<title>Mobile Code - SPCK clone</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mobile Code">
<meta name="application-name" content="Mobile Code">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/darcula.min.css">
<style>
:root{--bg:#1e1e1e;--panel:#252526;--panel2:#2d2d30;--text:#d4d4d4;--muted:#8a8a8a;--accent:#4f9cf7;--border:#3a3a3d;--shadow:0 6px 20px rgba(0,0,0,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
:root[data-theme="light"]{--bg:#f5f5f5;--panel:#ffffff;--panel2:#ebebed;--text:#222;--muted:#6b6b6b;--accent:#1769d6;--border:#d6d6da;--shadow:0 6px 20px rgba(0,0,0,.15);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--text);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;display:flex;flex-direction:column;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Izinkan seleksi hanya di editor & input */
.CodeMirror,.CodeMirror *,.CodeMirror-line,input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:5}
.ib{width:38px;height:38px;border-radius:16px;display:grid;place-items:center;transition:background .2s,transform .15s;flex:none}
.ib:active{transform:scale(.9);background:var(--panel2)}
.ib:hover{background:var(--panel2)}
.ib.run{color:#3ddc84}
.logo{font-weight:600;color:var(--accent);margin-right:2px;flex:none}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:16px;background:var(--bg);color:var(--muted);white-space:nowrap;flex:none;transition:all .2s;font-size:12px}
.tab.active{background:var(--accent);color:#fff}
.tab .x{opacity:.7;font-size:15px;line-height:1;padding:0 3px}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#f0b429}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#editorWrap{flex:1;min-height:0;position:relative}
.CodeMirror{height:100%;font-family:'JetBrains Mono',monospace;font-size:14px}
:root[data-theme="light"] .CodeMirror{background:#fff;color:#222}
:root[data-theme="light"] .CodeMirror-gutters{background:#f0f0f2;border-right:1px solid var(--border)}
#keys{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--panel);border-top:1px solid var(--border);scrollbar-width:none}
#keys::-webkit-scrollbar{display:none}
#keys button{min-width:42px;height:38px;border-radius:16px;background:var(--panel2);font-weight:600;flex:none;padding:0 10px;transition:transform .12s,background .2s}
#keys button:active{transform:scale(.9);background:var(--accent);color:#fff}
#preview{display:none;flex-direction:column;height:50%;border-top:2px solid var(--accent);background:var(--panel)}
#preview.show{display:flex;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;gap:6px;padding:4px 10px;color:var(--muted)}
.phead b{flex:1;font-weight:600}
#frame{flex:1;border:0;background:#fff;width:100%;border-radius:16px 16px 0 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);z-index:21;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-radius:0 24px 24px 0;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.show{transform:none}
.dtabs{display:flex;gap:4px;padding:10px}
.dtabs button{flex:1;padding:9px 4px;border-radius:16px;color:var(--muted);transition:all .2s;font-size:12px}
.dtabs button.on{background:var(--accent);color:#fff}
.pane{display:none;flex:1;overflow-y:auto;padding:0 10px 10px}
.pane.on{display:block}
.row{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;transition:background .2s}
.row.active{background:var(--panel2);color:var(--accent)}
.row .nm{flex:1;padding:8px 0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ib{width:32px;height:32px}.row svg{width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:16px;background:var(--accent);color:#fff;font-weight:600;margin:6px 0 10px;transition:transform .15s}
.btn:active{transform:scale(.97)}
input.in{width:100%;padding:11px 14px;border-radius:16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;outline:none}
input.in:focus{border-color:var(--accent)}
mark{background:#f0b429;color:#000;border-radius:4px;padding:0 1px}
.hint{color:var(--muted);font-size:12px;padding:6px 4px}
.mod{color:#f0b429;font-weight:600;width:16px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:10px 18px;border-radius:24px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#menu{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:8px;background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:6px;z-index:30;display:none;min-width:190px}
#menu.show{display:block;animation:up .2s ease}
#menu button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:14px}
#menu button:hover{background:var(--panel2)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#dlg.show{display:flex}
.card{background:var(--panel);border-radius:24px;padding:18px;width:min(340px,100%);box-shadow:var(--shadow);animation:up .2s ease}
.card h3{margin:0 0 12px;font-size:15px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:10px;border-radius:16px;background:var(--panel2)}
.acts .ok{background:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<header>
  <button class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <span class="logo">Spck</span>
  <div id="tabs"></div>
  <button class="ib run" id="btnRun" aria-label="Run"><svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button class="ib" id="btnSave" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H5zM8 3v5h7M8 21v-7h8v7"/></svg></button>
  <button class="ib" id="btnTheme" aria-label="Tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
  <button class="ib" id="btnMore" aria-label="Lainnya"><svg viewBox="0 0 24 24" style="fill:currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
</header>

<main>
  <div id="editorWrap"><textarea id="code"></textarea></div>
  <div id="preview">
    <div class="phead"><b>Preview</b>
      <button class="ib" id="pRefresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="ib" id="pClose" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
  </div>
  <div id="keys"></div>
</main>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dtabs">
    <button data-p="explorer" class="on">Explorer</button>
    <button data-p="git">Git</button>
    <button data-p="search">Search</button>
  </div>
  <section class="pane on" id="p-explorer">
    <button class="btn" id="newFile">+ File baru</button>
    <div id="fileList"></div>
  </section>
  <section class="pane" id="p-git">
    <div class="hint">Branch: main · origin</div>
    <div id="gitList"></div>
    <input class="in" id="commitMsg" placeholder="Pesan commit…" style="margin-top:8px">
    <button class="btn" id="commitBtn">Commit &amp; Push</button>
  </section>
  <section class="pane" id="p-search">
    <input class="in" id="searchIn" placeholder="Cari nama file…" style="margin-top:4px">
    <div id="searchList" style="margin-top:8px"></div>
  </section>
</aside>

<div id="menu">
  <button id="mDl">Download file aktif</button>
  <button id="mCloseTab">Tutup tab aktif</button>
  <button id="mReset">Reset ke default</button>
</div>
<div id="dlg"><div class="card"><h3 id="dTitle"></h3><input class="in" id="dIn"><p id="dMsg" class="hint" style="display:none"></p><div class="acts"><button id="dNo">Batal</button><button class="ok" id="dYes">OK</button></div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script>
(function(){
var KEY='spck_clone_v1';
var DEFAULTS={
 'index.html':'<div class="card">\n  <h1>Halo, Spck! 👋</h1>\n  <p>Edit file ini lalu tekan ▶ Run.</p>\n  <button id="btn">Klik aku</button>\n  <p id="out"></p>\n</div>\n',
 'style.css':'body {\n  font-family: system-ui, sans-serif;\n  background: #0f172a;\n  display: grid;\n  place-items: center;\n  min-height: 100vh;\n  margin: 0;\n}\n.card {\n  background: #1e293b;\n  color: #e2e8f0;\n  padding: 24px;\n  border-radius: 24px;\n  text-align: center;\n}\nbutton {\n  background: #38bdf8;\n  border: 0;\n  padding: 10px 18px;\n  border-radius: 16px;\n  font-weight: 700;\n}\n',
 'script.js':'let n = 0;\ndocument.getElementById("btn").addEventListener("click", () => {\n  n++;\n  document.getElementById("out").textContent = "Diklik " + n + "x";\n});\nconsole.log("script.js jalan");\n',
 'README.md':'# Mobile Code\n\nIDE mobile sederhana.\n\n- Edit HTML, CSS, JS\n- Tekan Run untuk preview\n- Semua file tersimpan di localStorage\n'
};
var S={files:{},open:[],active:'',committed:{},theme:'dark'};
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.files)S=Object.assign(S,o)}}catch(e){}
 if(!Object.keys(S.files).length){S.files=Object.assign({},DEFAULTS);S.committed=Object.assign({},DEFAULTS);S.open=Object.keys(DEFAULTS).slice(0,3);S.active='index.html'}
 if(!S.files[S.active])S.active=Object.keys(S.files)[0]||'';
 S.open=S.open.filter(function(n){return S.files[n]!==undefined});
 if(S.active&&S.open.indexOf(S.active)<0)S.open.push(S.active);
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},1800)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function modeOf(n){var e=n.split('.').pop().toLowerCase();return{html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',json:{name:'javascript',json:true}}[e]||'text/plain'}
function isMod(n){return S.files[n]!==S.committed[n]}

load();

/* ===== Tema: sinkronkan status bar + document ===== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.theme);
  var meta=document.getElementById('themeColorMeta');
  if(meta)meta.setAttribute('content',S.theme==='dark'?'#1e1e1e':'#f5f5f5');
}
applyTheme();

var cm=CodeMirror.fromTextArea($('code'),{lineNumbers:true,theme:S.theme==='dark'?'darcula':'default',lineWrapping:true,autoCloseBrackets:true,indentUnit:2,tabSize:2,indentWithTabs:false,extraKeys:{Tab:function(c){c.replaceSelection('  ')}}});
var loading=false,deb;
function openInEditor(){
 loading=true;
 var f=S.active;
 cm.setOption('mode',modeOf(f||'x.txt'));
 cm.setValue(f?S.files[f]:'');
 cm.clearHistory();
 loading=false;
 setTimeout(function(){cm.refresh()},10);
}
cm.on('change',function(){
 if(loading||!S.active)return;
 S.files[S.active]=cm.getValue();
 clearTimeout(deb);deb=setTimeout(function(){persist();renderAll()},500);
});

function renderTabs(){
 var h='';
 S.open.forEach(function(n){
  h+='<button class="tab'+(n===S.active?' active':'')+'" data-n="'+esc(n)+'">'+(isMod(n)?'<span class="dot"></span>':'')+esc(n)+'<span class="x" data-x="'+esc(n)+'">×</span></button>';
 });
 $('tabs').innerHTML=h;
 var a=$('tabs').querySelector('.active');if(a)a.scrollIntoView({inline:'nearest',block:'nearest'});
}
$('tabs').addEventListener('click',function(e){
 var x=e.target.closest('[data-x]');
 if(x){closeTab(x.dataset.x);return}
 var t=e.target.closest('.tab');if(t)switchTo(t.dataset.n);
});
function closeTab(n){
 var i=S.open.indexOf(n);if(i<0)return;
 S.open.splice(i,1);
 if(S.active===n){S.active=S.open[Math.max(0,i-1)]||'';if(!S.active&&!S.open.length){var k=Object.keys(S.files)[0];if(k){S.active=k;S.open=[k]}}openInEditor()}
 persist();renderAll();
}
function switchTo(n){
 if(!S.files.hasOwnProperty(n))return;
 S.active=n;if(S.open.indexOf(n)<0)S.open.push(n);
 openInEditor();persist();renderAll();
}
function renderFiles(){
 var h='';
 Object.keys(S.files).forEach(function(n){
  h+='<div class="row'+(n===S.active?' active':'')+'"><button class="nm" data-open="'+esc(n)+'">📄 '+esc(n)+'</button>'
   +'<button class="ib" data-ren="'+esc(n)+'" aria-label="Rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg></button>'
   +'<button class="ib" data-del="'+esc(n)+'" aria-label="Hapus"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>';
 });
 $('fileList').innerHTML=h||'<div class="hint">Belum ada file.</div>';
}
$('fileList').addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.dataset.open){switchTo(t.dataset.open);closeDrawer()}
 else if(t.dataset.ren)renameFile(t.dataset.ren);
 else if(t.dataset.del)deleteFile(t.dataset.del);
});
function renderGit(){
 var m=Object.keys(S.files).filter(isMod);
 var gone=Object.keys(S.committed).filter(function(n){return S.files[n]===undefined});
 var h='';
 m.forEach(function(n){h+='<div class="row"><span class="mod">'+(S.committed[n]===undefined?'A':'M')+'</span><span class="nm" style="padding:8px 0">'+esc(n)+'</span></div>'});
 gone.forEach(function(n){h+='<div class="row"><span class="mod" style="color:#f87171">D</span><span class="nm" style="padding:8px 0">'+esc(n)+'</span></div>'});
 $('gitList').innerHTML=h||'<div class="hint">Tidak ada perubahan.</div>';
}
function renderSearch(){
 var q=$('searchIn').value.trim().toLowerCase(),h='';
 Object.keys(S.files).forEach(function(n){
  var i=n.toLowerCase().indexOf(q);
  if(q&&i<0)return;
  var label=q?esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+q.length))+'</mark>'+esc(n.slice(i+q.length)):esc(n);
  h+='<div class="row"><button class="nm" data-open="'+esc(n)+'">📄 '+label+'</button></div>';
 });
 $('searchList').innerHTML=h||'<div class="hint">Tidak ada hasil.</div>';
}
$('searchList').addEventListener('click',function(e){var t=e.target.closest('[data-open]');if(t){switchTo(t.dataset.open);closeDrawer()}});
$('searchIn').addEventListener('input',renderSearch);
function renderAll(){renderTabs();renderFiles();renderGit();renderSearch()}

/* dialog */
function dialog(title,opt){
 return new Promise(function(res){
  opt=opt||{};
  $('dTitle').textContent=title;
  var inp=$('dIn');inp.style.display=opt.input===false?'none':'block';inp.value=opt.value||'';
  var m=$('dMsg');m.style.display=opt.msg?'block':'none';m.textContent=opt.msg||'';
  $('dYes').textContent=opt.ok||'OK';
  $('dlg').classList.add('show');
  if(opt.input!==false)setTimeout(function(){inp.focus();inp.select()},50);
  function done(v){$('dlg').classList.remove('show');$('dYes').onclick=$('dNo').onclick=inp.onkeydown=null;res(v)}
  $('dYes').onclick=function(){done(opt.input===false?true:inp.value.trim())};
  $('dNo').onclick=function(){done(null)};
  inp.onkeydown=function(e){if(e.key==='Enter')$('dYes').onclick()};
 });
}
function validName(n,except){
 if(!n||/[\/\\]/.test(n)){toast('Nama tidak valid');return false}
 if(n!==except&&S.files.hasOwnProperty(n)){toast('Nama sudah ada');return false}
 return true;
}
$('newFile').onclick=function(){
 dialog('File baru',{value:'untitled.txt'}).then(function(n){
  if(n===null||!validName(n))return;
  S.files[n]='';switchTo(n);closeDrawer();toast('Dibuat: '+n);
 });
};
function renameFile(old){
 dialog('Ganti nama',{value:old}).then(function(n){
  if(n===null||n===old||!validName(n,old))return;
  var o={};Object.keys(S.files).forEach(function(k){o[k===old?n:k]=S.files[k]});S.files=o;
  S.open=S.open.map(function(k){return k===old?n:k});
  if(S.active===old){S.active=n;openInEditor()}
  persist();renderAll();toast('Diganti: '+n);
 });
}
function deleteFile(n){
 dialog('Hapus file?',{input:false,msg:n,ok:'Hapus'}).then(function(ok){
  if(!ok)return;
  delete S.files[n];S.open=S.open.filter(function(k){return k!==n});
  if(S.active===n){S.active=S.open[0]||Object.keys(S.files)[0]||'';if(S.active&&S.open.indexOf(S.active)<0)S.open.push(S.active);openInEditor()}
  persist();renderAll();toast('Dihapus');
 });
}

/* drawer */
function openDrawer(){$('drawer').classList.add('show');$('scrim').classList.add('show')}
function closeDrawer(){$('drawer').classList.remove('show');$('scrim').classList.remove('show')}
$('btnMenu').onclick=openDrawer;$('scrim').onclick=function(){closeDrawer();$('menu').classList.remove('show')};
document.querySelectorAll('.dtabs button').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('.dtabs button').forEach(function(x){x.classList.toggle('on',x===b)});
 document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+b.dataset.p)});
}});

/* git */
$('commitBtn').onclick=function(){
 var msg=$('commitMsg').value.trim();
 if(!Object.keys(S.files).some(isMod)&&!Object.keys(S.committed).some(function(n){return S.files[n]===undefined})){toast('Tidak ada perubahan');return}
 if(!msg){toast('Isi pesan commit');return}
 S.committed=Object.assign({},S.files);$('commitMsg').value='';
 persist();renderAll();toast('Pushed to origin main');
};

/* toolbar */
function saveNow(){if(S.active)S.files[S.active]=cm.getValue();clearTimeout(deb);persist();renderAll();toast('Tersimpan')}
$('btnSave').onclick=saveNow;
$('btnTheme').onclick=function(){
 S.theme=S.theme==='dark'?'light':'dark';
 applyTheme();
 cm.setOption('theme',S.theme==='dark'?'darcula':'default');
 persist();
};
$('btnMore').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('show')};
document.addEventListener('click',function(e){if(!e.target.closest('#menu')&&e.target.id!=='btnMore')$('menu').classList.remove('show')});
$('mDl').onclick=function(){
 $('menu').classList.remove('show');if(!S.active)return;
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.files[S.active]],{type:'text/plain'}));a.download=S.active;a.click();
};
$('mCloseTab').onclick=function(){$('menu').classList.remove('show');if(S.active)closeTab(S.active)};
$('mReset').onclick=function(){
 $('menu').classList.remove('show');
 dialog('Reset semua file?',{input:false,msg:'Semua perubahan akan hilang.',ok:'Reset'}).then(function(ok){
  if(!ok)return;
  S.files=Object.assign({},DEFAULTS);S.committed=Object.assign({},DEFAULTS);S.open=['index.html','style.css','script.js'];S.active='index.html';
  openInEditor();persist();renderAll();toast('Direset');
 });
};

/* preview — perbaiki doctype agar tidak quirks mode */
function buildDoc(){
 if(S.active)S.files[S.active]=cm.getValue();
 return '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'
  +(S.files['style.css']||'')+'</style></head><body>'
  +(S.files['index.html']||'')+'<script>'+(S.files['script.js']||'')+'<\/script></body></html>';
}
function runPreview(){$('frame').srcdoc=buildDoc();$('preview').classList.add('show');setTimeout(function(){cm.refresh()},50)}
$('btnRun').onclick=runPreview;
$('pRefresh').onclick=function(){$('frame').srcdoc=buildDoc();toast('Preview dimuat ulang')};
$('pClose').onclick=function(){$('preview').classList.remove('show');$('frame').srcdoc='';setTimeout(function(){cm.refresh()},50)};

/* extra keyboard */
var KEYS=['<','>','{','}','(',')',';',':','=','/','"',"'",'!','&','|','Tab','→','←','.'];
KEYS.forEach(function(k){
 var b=document.createElement('button');b.textContent=k;
 b.addEventListener('mousedown',function(e){e.preventDefault()});
 b.addEventListener('touchstart',function(e){e.preventDefault();press(k)},{passive:false});
 b.addEventListener('click',function(){press(k)});
 $('keys').appendChild(b);
});
var lastT=0;
function press(k){
 var now=Date.now();if(now-lastT<60)return;lastT=now;
 if(k==='Tab')cm.replaceSelection('  ');
 else if(k==='→')cm.execCommand('goCharRight');
 else if(k==='←')cm.execCommand('goCharLeft');
 else cm.replaceSelection(k);
 cm.focus();
}

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveNow()}});

/* Cegah context menu browser di UI (kecuali editor/input) */
document.addEventListener('contextmenu',function(e){
  if(e.target.closest('.CodeMirror, input, textarea'))return;
  e.preventDefault();
},{passive:false});

/* ===== Service Worker: register + update notifikasi ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(reg){
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('Versi baru tersedia. Tutup & buka lagi untuk update.');
          }
        });
      });
    }).catch(function(){/* diabaikan */});
  });
  navigator.serviceWorker.addEventListener('message',function(e){
    if(e.data&&e.data.type==='HTML_UPDATED'){
      toast('Kode terbaru tersedia. Tutup & buka lagi untuk update.');
    }
  });
}

/* ===== File Handlers (Launch Queue API) dari manifest.json ===== */
if('launchQueue' in window){
  launchQueue.setConsumer(async function(params){
    if(!params||!params.files||!params.files.length)return;
    for(var i=0;i<params.files.length;i++){
      try{
        var handle=params.files[i];
        var file=await handle.getFile();
        var text=await file.text();
        var name=file.name||'file.txt';
        var dot=name.lastIndexOf('.');
        var base=dot>0?name.slice(0,dot):name;
        var ext=dot>0?name.slice(dot):'';
        var candidate=name,n=1;
        while(S.files[candidate]!==undefined){candidate=base+' ('+n+')'+ext;n++;}
        S.files[candidate]=text;
        switchTo(candidate);
        toast('Dibuka: '+candidate);
      }catch(err){}
    }
    persist();
  });
}

openInEditor();renderAll();
})();
</script>
</body>
</html>
